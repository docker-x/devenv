name: "Test devenv modules"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Evaluate Nix modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify Nix syntax
        run: |
          # Check that all .nix files parse without errors.
          # nix-instantiate --parse exits non-zero on syntax errors.
          find . -name '*.nix' -not -path './.git/*' | sort | while read -r f; do
            echo "Checking $f..."
            nix-instantiate --parse "$f" > /dev/null
          done

      - name: Install devenv CLI
        run: nix profile install github:cachix/devenv/latest --accept-flake-config

      - name: Run devenv info
        run: devenv info
