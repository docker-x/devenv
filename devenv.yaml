# devenv.yaml — docker-x/devenv module library
#
# This file is used when developing/testing this repo itself.
# Downstream projects consume docker-x/devenv by adding it as an input
# in their own devenv.yaml (see examples/).
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling

# Repo-local evaluation (CI test.yaml enables dx.agents.claudeCode, which
# pulls the unfree claude-code package). Downstream consumers set their own
# permit in their devenv.yaml — this only affects this repo's eval.
nixpkgs:
  permitted_unfree_packages:
    - claude-code
